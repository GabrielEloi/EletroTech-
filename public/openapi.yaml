openapi: 3.0.0
info:
  title: API do EletroTech
  version: 1.0.0
  description: Documentação interativa da API do sistema EletroTech
servers:
  - url: http://localhost:3001/api
    description: Servidor de Desenvolvimento
paths:
  /servicos:
    get:
      summary: Lista todos os serviços técnicos
      tags:
        - Serviços
      responses:
        '200':
          description: Lista retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    nome:
                      type: string
                    status:
                      type: string